// The Android app: SDL3's Java side (copied from SDL's android-project by build_android.sh) and the native
// libraries build_android.sh puts in app/libs/arm64-v8a: libSDL3.so, libc++_shared.so, libmain.so (the loader,
// native/loader.c) and libbt3game.so (the game image, not a real library: the loader maps it below 4 GB).
plugins {
    id 'com.android.application'
}

android {
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    defaultConfig {
        applicationId "io.github.tenkaichi3decomp"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "0.1-android"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
        assets.srcDir 'assets'
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true          // extracted to the app's library folder, where the loader opens the image
            keepDebugSymbols += ['**/*.so']    // left as built (the image is already stripped of its debug sections)
        }
    }
    lint {
        abortOnError = false
    }
}
